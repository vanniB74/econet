        .mobile-menu{transform:translateX(100%);transition:transform .3s ease}

        @media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:0s!important}}

function t(key){return T[appState.currentLang][key]||T['en'][key]||key}
function navigateTo(page){appState.currentPage=page;document.querySelectorAll('.page-container').forEach(p=>p.classList.remove('page-active'));const target=document.getElementById('page-'+page);if(target){setTimeout(()=>target.classList.add('page-active'),30)}window.scrollTo({top:0,behavior:'smooth'});closeMobileMenu();}
function setLang(lang){appState.currentLang=lang;localStorage.setItem('econet-lang',lang);renderAll();}
function showToast(msg,icon='fa-check'){const el=document.getElementById('toast');el.innerHTML=`<i class="fa-solid ${icon} mr-2"></i>${msg}`;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000);}
function openModal(id){document.getElementById(id).classList.remove('hidden');document.body.style.overflow='hidden'}
function closeModal(id){document.getElementById(id).classList.add('hidden');document.body.style.overflow=''}
function toggleMobileMenu(){appState.mobileMenuOpen=!appState.mobileMenuOpen;document.getElementById('mobile-menu').classList.toggle('open',appState.mobileMenuOpen);}
function closeMobileMenu(){appState.mobileMenuOpen=false;document.getElementById('mobile-menu').classList.remove('open')}
function handleSignIn(e){e.preventDefault();appState.isLoggedIn=true;closeModal('signin-modal');renderAll();showToast(t('toast_welcome'),'fa-user-check');}
function handleSignOut(){appState.isLoggedIn=false;appState.hasSubscription=true;renderAll();navigateTo('home');showToast(t('toast_signout'),'fa-right-from-bracket');}
function toggleSubscription(){appState.hasSubscription=!appState.hasSubscription;renderAll();showToast(appState.hasSubscription?t('toast_sub_react'):t('toast_sub_cancel'),'fa-credit-card');}

function renderNav(){return `<nav class="fixed top-0 left-0 right-0 z-50 backdrop-blur-xl bg-eco-black/80 border-b border-white/5"><div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between"><a href="#" onclick="navigateTo('home');return false" class="font-partitura font-bold text-lg">EcoNet</a><div class="hidden lg:flex items-center gap-8">${['home','overture','dev','botanical','team','gallery','climax'].map(p=>`<a href="#" class="text-xs font-semibold uppercase ${appState.currentPage===p?'text-eco-lime':'text-neutral-400'}" onclick="navigateTo('${p}');return false">${t('nav_'+p)}</a>`).join('')}</div><div class="flex items-center gap-3">${appState.isLoggedIn?`<button onclick="handleSignOut()" class="bg-eco-lime text-eco-black px-5 py-2 rounded-full text-xs font-bold">${t('btn_dashboard')}</button>`:`<button onclick="openModal('signin-modal')" class="border border-eco-lime/40 text-eco-lime px-5 py-2 rounded-full text-xs font-bold">${t('btn_sign_in')}</button>`}</div></div></nav><div id="mobile-menu" class="mobile-menu fixed top-0 right-0 w-80 h-full z-[60] bg-eco-black/95 p-8 pt-24"></div>`;}

function renderHome(){return `<section class="min-h-screen flex items-center justify-center pt-20"><div class="max-w-4xl mx-auto px-6 text-center"><h1 class="font-partitura text-7xl font-black mb-8">${t('home_title')}</h1><p class="text-lg text-neutral-400 mb-16">${t('home_sub')}</p><button onclick="navigateTo('overture')" class="bg-eco-lime text-eco-black px-8 py-4 rounded-full font-bold">Begin</button></div></section>`;}

function renderOverture(){return `<section class="min-h-screen pt-32"><div class="max-w-6xl mx-auto px-6"><h2 class="font-partitura text-6xl font-black mb-8">${t('ouv_title')}</h2><div class="bg-eco-card border border-eco-border rounded-2xl p-10"><h3 class="text-2xl font-bold mb-4">${t('ouv_mission_title')}</h3><p>${t('ouv_mission_text')}</p></div></div></section>`;}

function renderDev(){return `<section class="min-h-screen pt-32"><div class="max-w-6xl mx-auto px-6"><h2 class="font-partitura text-6xl font-black mb-16">${t('dev_title')}</h2></div></section>`;}

function renderBotanical(){return `<section class="min-h-screen pt-32"><div class="max-w-6xl mx-auto px-6"><h2 class="font-partitura text-6xl font-black mb-16">${t('herbs_title')}</h2><div class="grid grid-cols-3 gap-6">${[1,2,3,4,5,6].map(i=>`<div class="bg-eco-card rounded-2xl p-6"><p class="text-eco-lime">${t('herb'+i+'_name')}</p></div>`).join('')}</div></div></section>`;}

function renderTeam(){return `<section class="min-h-screen pt-32"><div class="max-w-6xl mx-auto px-6"><h2 class="font-partitura text-6xl font-black mb-16">${t('team_title')}</h2></div></section>`;}

function renderGallery(){return `<section class="min-h-screen pt-32"><div class="max-w-6xl mx-auto px-6"><h2 class="font-partitura text-6xl font-black">Gallery</h2></div></section>`;}

function renderClimax(){return `<section class="min-h-screen pt-32"><div class="max-w-6xl mx-auto px-6"><h2 class="font-partitura text-6xl font-black mb-16">${t('climax_title')}</h2></div></section>`;}

function renderDashboard(){return `<section class="min-h-screen pt-32"><div class="max-w-6xl mx-auto px-6"><h2 class="font-partitura text-6xl font-black">${t('dash_title')}</h2></div></section>`;}

function renderFooter(){return `<footer class="border-t border-white/5 py-16"><div class="max-w-6xl mx-auto px-6"><p class="text-sm text-neutral-600">© 2026 EcoNet — ${t('foot_rights')}</p></div></footer>`;}

function renderAll(){
    document.getElementById('nav-container').innerHTML=renderNav();
    document.getElementById('home-content').innerHTML=renderHome();
    document.getElementById('overture-content').innerHTML=renderOverture();
    document.getElementById('dev-content').innerHTML=renderDev();
    document.getElementById('botanical-content').innerHTML=renderBotanical();
    document.getElementById('team-content').innerHTML=renderTeam();
    document.getElementById('gallery-content').innerHTML=renderGallery();
    document.getElementById('climax-content').innerHTML=renderClimax();
    document.getElementById('dashboard-content').innerHTML=renderDashboard();
    document.getElementById('footer-container').innerHTML=renderFooter();
    document.querySelectorAll('.page-container').forEach(p=>p.classList.remove('page-active'));
    const cur=document.getElementById('page-'+appState.currentPage);
    if(cur)cur.classList.add('page-active');
}

document.addEventListener('DOMContentLoaded',()=>{
    renderAll();
    document.getElementById('page-home').classList.add('page-active');
    document.querySelectorAll('.modal-backdrop').forEach(m=>{
        m.addEventListener('click',(e)=>{if(e.target===m){m.classList.add('hidden');document.body.style.overflow=''}});
    });
    document.addEventListener('keydown',(e)=>{
        if(e.key==='Escape'){
            document.querySelectorAll('.modal-backdrop:not(.hidden)').forEach(m=>{m.classList.add('hidden');document.body.style.overflow=''});
            closeMobileMenu();
        }
    });
});
</script>

<div id="nav-container"></div>

<main class="relative" style="min-height:100vh">
    <div id="page-home" class="page-container"><div id="home-content"></div></div>
    <div id="page-overture" class="page-container"><div id="overture-content"></div></div>
    <div id="page-dev" class="page-container"><div id="dev-content"></div></div>
    <div id="page-botanical" class="page-container"><div id="botanical-content"></div></div>
    <div id="page-team" class="page-container"><div id="team-content"></div></div>
    <div id="page-gallery" class="page-container"><div id="gallery-content"></div></div>

<div id="footer-container"></div>

<div id="signin-modal" class="modal-backdrop hidden fixed inset-0 z-[70] bg-black/80 backdrop-blur-sm flex items-center justify-center p-6">
    <div class="bg-eco-gray border border-eco-border rounded-2xl p-10 w-full max-w-md">
        <button onclick="closeModal('signin-modal')" class="absolute top-4 right-4 w-8 h-8 text-neutral-500">✕</button>
        <h3 class="font-partitura text-2xl font-bold mb-8">Sign In</h3>
        <form onsubmit="handleSignIn(event)" class="space-y-5">
            <div>
                <label for="email" class="block text-xs text-neutral-500 uppercase mb-2">Email</label>
                <input type="email" id="email" required placeholder="mario@econet.coop" class="w-full bg-eco-black border border-eco-border rounded-xl px-5 py-3 text-sm text-white focus:outline-none focus:border-eco-lime">
            </div>
            <div>
                <label for="password" class="block text-xs text-neutral-500 uppercase mb-2">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-eco-black border border-eco-border rounded-xl px-5 py-3 text-sm text-white focus:outline-none focus:border-eco-lime">
            </div>
            <button type="submit" class="w-full bg-eco-lime text-eco-black py-3 rounded-xl text-sm font-bold uppercase">Access Hub</button>
        </form>
    </div>
</div>

<div id="toast" class="toast fixed bottom-8 left-1/2 -translate-x-1/2 z-[80] bg-eco-gray border border-eco-border rounded-xl px-6 py-4 text-sm font-medium"></div>

function t(key){return T[appState.currentLang][key]||T['en'][key]||key}

/* ======================== HELPERS ======================== */
function navigateTo(page){
    appState.currentPage=page;
    document.querySelectorAll('.page-container').forEach(p=>p.classList.remove('page-active'));
    const target=document.getElementById('page-'+page);
    if(target){setTimeout(()=>target.classList.add('page-active'),30)}
    document.querySelectorAll('.nav-link').forEach(l=>{l.classList.toggle('active',l.dataset.page===page)});
    window.scrollTo({top:0,behavior:'smooth'});
    closeMobileMenu();
    setTimeout(observeAnimations,100);
}

function setLang(lang){
    appState.currentLang=lang;
    localStorage.setItem('econet-lang',lang);
    renderAll();
    showToast(t('toast_lang'),'fa-globe');
}

function showToast(msg,icon='fa-check'){
    const el=document.getElementById('toast');
    el.innerHTML=`<i class="fa-solid ${icon} text-eco-lime mr-3"></i>${msg}`;
    el.classList.add('show');
    setTimeout(()=>el.classList.remove('show'),3000);
}

function openModal(id){document.getElementById(id).classList.remove('hidden');document.body.style.overflow='hidden'}
function closeModal(id){document.getElementById(id).classList.add('hidden');document.body.style.overflow=''}

function toggleMobileMenu(){
    appState.mobileMenuOpen=!appState.mobileMenuOpen;
    document.getElementById('mobile-menu').classList.toggle('open',appState.mobileMenuOpen);
}
function closeMobileMenu(){appState.mobileMenuOpen=false;document.getElementById('mobile-menu').classList.remove('open')}

function handleSignIn(e){
    e.preventDefault();
    appState.isLoggedIn=true;
    closeModal('signin-modal');
    renderAll();
    showToast(t('toast_welcome'),'fa-user-check');
}

function handleSignOut(){
    appState.isLoggedIn=false;
    appState.hasSubscription=true;
    renderAll();
    navigateTo('home');
    showToast(t('toast_signout'),'fa-right-from-bracket');
}

function toggleSubscription(){
    appState.hasSubscription=!appState.hasSubscription;
    renderAll();
    showToast(appState.hasSubscription?t('toast_sub_react'):t('toast_sub_cancel'),'fa-credit-card');
}

function openImageModal(src,cap){
    const m=document.getElementById('image-modal');
    m.querySelector('img').src=src;
    m.querySelector('p').textContent=cap;
    m.classList.remove('hidden');
    document.body.style.overflow='hidden';
    m.querySelector('img').style.transform='scale(1)';
}

function handleModalZoom(e){
    const img=e.currentTarget.querySelector('img');
    const r=img.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5;
    const y=(e.clientY-r.top)/r.height-.5;
    img.style.transform=`scale(2.5) translate(${-x*40}%,${-y*40}%)`;
}

/* ======================== SCROLL ANIMATIONS ======================== */
function observeAnimations(){
    const obs=new IntersectionObserver((entries)=>{
        entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}});
    },{threshold:0.1,rootMargin:'0px 0px -40px 0px'});
    document.querySelectorAll('.fade-in-up,.slide-left,.slide-right').forEach(el=>{
        if(!el.classList.contains('visible'))obs.observe(el);
    });
    /* Animate KPI bars */
    const kpiObs=new IntersectionObserver((entries)=>{
        entries.forEach(e=>{if(e.isIntersecting){
            e.target.querySelectorAll('.kpi-bar').forEach(bar=>{
                const w=bar.dataset.width;
                setTimeout(()=>bar.style.width=w+'%',100);
            });
            kpiObs.unobserve(e.target);
        }});
    },{threshold:0.2});
    document.querySelectorAll('.kpi-container').forEach(c=>kpiObs.observe(c));
}

function renderAll(){
    document.getElementById('nav-container').innerHTML=renderNav();
    document.getElementById('home-content').innerHTML=renderHome();
    document.getElementById('overture-content').innerHTML=renderOverture();
    document.getElementById('dev-content').innerHTML=renderDev();
    document.getElementById('botanical-content').innerHTML=renderBotanical();
    document.getElementById('team-content').innerHTML=renderTeam();
    document.getElementById('gallery-content').innerHTML=renderGallery();
    document.getElementById('climax-content').innerHTML=renderClimax();
    document.getElementById('dashboard-content').innerHTML=renderDashboard();
    document.getElementById('footer-container').innerHTML=renderFooter();
    /* Re-activate current page */
    document.querySelectorAll('.page-container').forEach(p=>p.classList.remove('page-active'));
    const cur=document.getElementById('page-'+appState.currentPage);
    if(cur)cur.classList.add('page-active');
    /* Update sign-in modal text */
    const si=document.getElementById('signin-modal');
    if(si){
        si.querySelector('h3').textContent=t('modal_signin_title');
        si.querySelector('label[for="email"]').textContent=t('modal_email');
        si.querySelector('label[for="password"]').textContent=t('modal_pass');
        si.querySelector('button[type="submit"]').innerHTML=`<i class="fa-solid fa-right-to-bracket mr-2"></i>${t('modal_access')}`;
        si.querySelector('.remember-label').textContent=t('modal_remember');
        si.querySelector('.forgot-link').textContent=t('modal_forgot');
    }
    setTimeout(observeAnimations,50);
}

/* ======================== INIT ======================== */
document.addEventListener('DOMContentLoaded',()=>{
    renderAll();
    /* Set home as active */
    document.getElementById('page-home').classList.add('page-active');
    setTimeout(observeAnimations,200);

    /* Close modals on backdrop click */
    document.querySelectorAll('.modal-backdrop').forEach(m=>{
        m.addEventListener('click',(e)=>{if(e.target===m){m.classList.add('hidden');document.body.style.overflow=''}});
    });

    /* Close mobile menu on outside click */
    document.addEventListener('click',(e)=>{
        if(appState.mobileMenuOpen && !e.target.closest('#mobile-menu') && !e.target.closest('[onclick*="toggleMobileMenu"]')){
            closeMobileMenu();
        }
    });

    /* Keyboard: Escape closes modals */
    document.addEventListener('keydown',(e)=>{
        if(e.key==='Escape'){
            document.querySelectorAll('.modal-backdrop:not(.hidden)').forEach(m=>{m.classList.add('hidden');document.body.style.overflow=''});
            closeMobileMenu();
        }
    });
});

                <input type="email" id="email" required placeholder="mario@econet.coop" class="w-full bg-eco-black border border-eco-border rounded-xl px-5 py-3.5 text-sm text-white placeholder:text-neutral-700 focus:outline-none focus:border-eco-lime/50 transition-colors">
            </div>
            <div>
                <label for="password" class="block text-xs text-neutral-500 uppercase tracking-widest mb-2">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-eco-black border border-eco-border rounded-xl px-5 py-3.5 text-sm text-white placeholder:text-neutral-700 focus:outline-none focus:border-eco-lime/50 transition-colors">
            </div>
            <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 rounded border-eco-border bg-eco-black accent-eco-lime">
                    <span class="remember-label text-xs text-neutral-500">Remember me</span>
                </label>
                <a href="#" class="forgot-link text-xs text-eco-lime/60 hover:text-eco-lime transition-colors">Forgot password?</a>
            </div>
            <button type="submit" class="w-full bg-eco-lime text-eco-black py-4 rounded-xl text-sm font-bold uppercase tracking-wider hover:shadow-[0_0_30px_rgba(132,192,22,.3)] transition-all">
                <i class="fa-solid fa-right-to-bracket mr-2"></i>Access Hub
            </button>
        </form>
    </div>
</div>

<!-- ======================== IMAGE MODAL ======================== -->
<div id="image-modal" class="modal-backdrop hidden fixed inset-0 z-[70] bg-black/90 backdrop-blur-md flex items-center justify-center p-6 cursor-zoom-out" onclick="if(event.target===this){closeModal('image-modal');document.body.style.overflow=''}" onmousemove="handleModalZoom(event)">
    <button onclick="closeModal('image-modal');document.body.style.overflow=''" class="absolute top-6 right-6 w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20 transition-all z-10"><i class="fa-solid fa-xmark"></i></button>
    <div class="max-w-5xl max-h-[85vh] overflow-hidden rounded-2xl">
        <img src="" alt="" class="max-w-full max-h-[85vh] object-contain" style="transform-origin:center center">
    </div>
    <p class="absolute bottom-6 left-1/2 -translate-x-1/2 text-sm text-neutral-400 font-light bg-black/60 backdrop-blur-sm px-5 py-2 rounded-full"></p>
</div>

<!-- ======================== TOAST ======================== -->
<div id="toast" class="toast fixed bottom-8 left-1/2 -translate-x-1/2 z-[80] bg-eco-gray border border-eco-border rounded-xl px-6 py-4 text-sm font-medium shadow-2xl flex items-center"></div>

</body>
